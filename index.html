<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1> Форма для отправки данных</h1>

    <span> Необходимо заполнить все данные в форме ниже:</span>

    <form action="#" method="post">

        <label for="user_country">Введите ваше имя</label>
        <input type="text" name="name" placeholder="Введите ваше имя" id="user_name"> <br>

        <label for="user_post">Введите вашу почту</label>
        <input type="text" name="post" placeholder="Введите вашу почту" id="user_post"> <br>

        <label for="user_password">Введите ваш пароль</label>        
        <input type="text" name="password" placeholder="Введите ваш пароль" id="user_password"> <br>

        <label for="user_country">Выберите страну проживния</label>
        <select name="country" id="user_country">
            <option value="rus">Россия</option>
            <option value="eng">Англия</option>
            <option value="tui">Тайланд</option>
            <option value="chi">Китай</option>
            <option value="mng">Монголия</option>
            <option value="arm">Армения</option>
            <option value="gru">Грузия</option>
            <option value="frn">Франция</option>

        </select> <br>

        <Input type="button" value="отправка данных">
        </Input> <br>

    </form>
</body>
</html>
